<!DOCTYPE html>
<html>
<head>
    <title>Myntra Clone</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f5f5f5;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ff3f6c;
        }

        nav a {
            margin: 0 12px;
            text-decoration: none;
            color: black;
            font-weight: bold;
        }

        nav a:hover {
            color: #ff3f6c;
        }

        .banner img {
            width: 100%;
            height: 400px;
            object-fit: cover;
        }

        .section-title {
            text-align: center;
            margin: 30px;
            font-size: 24px;
        }

        .products {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: white;
            width: 220px;
            padding: 10px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            width: 100%;
            border-radius: 8px;
        }

        .card h3 {
            font-size: 16px;
            margin: 10px 0 5px;
        }

        .price {
            color: #ff3f6c;
            font-weight: bold;
        }

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">Myntra</div>
    <nav>
        <a href="#">Men</a>
        <a href="#">Women</a>
        <a href="#">Kids</a>
        <a href="#">Beauty</a>
    </nav>
</header>

<!-- Banner -->
<section class="banner">
    <img src="https://images.unsplash.com/photo-1521334884684-d80222895322">
</section>

<h2 class="section-title">🔥 Trending Products</h2>

<section class="products">

    <div class="card">
        <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab">
        <h3>Men T-Shirt</h3>
        <p class="price">₹499</p>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff">
        <h3>Running Shoes</h3>
        <p class="price">₹1299</p>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d">
        <h3>Women Dress</h3>
        <p class="price">₹899</p>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f">
        <h3>Jacket</h3>
        <p class="price">₹1999</p>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1585386959984-a41552231658">
        <h3>Handbag</h3>
        <p class="price">₹1499</p>
    </div>

</section>

<footer>
    <p>© 2026 Myntra Clone | Made by You 😏</p>
</footer>

</body>
</html>
